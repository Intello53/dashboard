        var running = startD <= now && now < endD;
        var badge = "";
        if (past) badge = '<span aria-label="Terminé" style="color:var(--green)">✔</span>';
        else if (running) badge = '<span class="pill" style="background:color-mix(in srgb, var(--' + (ev.kind === "revision" ? "purple" : ev.kind === "cours" ? "blue" : ev.kind === "sport" ? "green" : ev.kind === "travail" ? "teal" : "red") + ') 10%, transparent); color:var(--' + (ev.kind === "revision" ? "purple" : ev.kind === "cours" ? "blue" : ev.kind === "sport" ? "green" : ev.kind === "travail" ? "teal" : "red") + ')">En cours</span>';
        else if (hl && !c.past) badge = '<span class="pill" style="color:var(--kc)">' + (c.d > 0 ? "J–" + c.d : "dans " + c.h + "h" + pad(c.m)) + "</span>";
        return '<div class="ev k-' + ev.kind + (past ? " past" : "") + (hl ? " hl" : "") + '">' +
          '<div class="time tnum">' + fmtT(ev.start) + ' <small>– ' + fmtT(ev.end) + "</small></div>" +
          '<div class="st" aria-hidden="true"></div>' +
          '<div style="flex:1;min-width:0"><div class="titleline"><span class="t">' + ev.title + "</span>" + badge + "</div>" +
          (ev.obj ? '<p class="obj" style="font-size:12px;color:var(--sub);margin:2px 0 0">' + ev.obj + "</p>" : "") +
          "</div></div>";
      }

      function ringSvg(id, r, pct, color, animate) {
        var c = 2 * Math.PI * r;
        return '<circle id="' + id + '" cx="100" cy="100" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + (c * (1 - (animate ? 0 : pct))) + '" style="transition: stroke-dashoffset 1.2s cubic-bezier(0.33,1,0.68,1)"/>';
      }

      function render() {
        var now = new Date();
        var todayK = dateKey(now);
        var app = document.getElementById("app");
        var chipScroll = 0;
        var chipEl = document.querySelector(".chips");
        if (chipEl) chipScroll = chipEl.scrollLeft;

        /* Données dynamiques */
        var upcoming = null;
        for (var i = 0; i < DAYS.length; i++) {
          var evs = DAYS[i].events.filter(function (e) { return evDate(DAYS[i].date, e.end) > now; });
          if (evs.length) { upcoming = { day: DAYS[i], events: evs, isToday: DAYS[i].date === todayK }; break; }
        }
        var day = DAYS.find(function (d) { return d.date === (selectedDay || (upcoming ? upcoming.day.date : DAYS[0].date)); }) || DAYS[0];
        var dayIsToday = day.date === todayK;

        var upDl = DEADLINES.filter(function (dl) { return !countdown(now, new Date(dl.at)).past; });
        var hero = upDl[0] || DEADLINES[DEADLINES.length - 1];
        var heroC = countdown(now, new Date(hero.at));
        var heroTitle = upDl.filter(function (dl) { return dl.at === hero.at; }).map(function (dl) { return dl.subject; }).join(" + ");
        var nextDl = upDl.find(function (dl) { return dl.at !== hero.at; });
        var nextC = nextDl ? countdown(now, new Date(nextDl.at)) : null;

        var charge = DAYS.map(function (d) {
          return { name: d.short, heures: Math.round(d.events.filter(function (e) { return e.kind === "revision" || e.kind === "travail"; }).reduce(function (s, e) { return s + durH(e); }, 0) * 4) / 4, ds: d.events.some(function (e) { return e.kind === "ds"; }) };
        });
        var totalVac = charge.slice(0, 4).reduce(function (s, c) { return s + c.heures; }, 0);
        var totalDs = charge.slice(4).reduce(function (s, c) { return s + c.heures; }, 0);
        var maxH = Math.max.apply(null, charge.map(function (c) { return c.heures; }));

        var nextFirst = upcoming ? upcoming.events[0] : null;
        var ncd = nextFirst ? countdown(now, evDate(upcoming.day.date, nextFirst.start)) : null;
        var expired = now > SNAPSHOT_END;

        document.getElementById("banner").innerHTML = expired
          ? '<div class="banner" role="alert">⚠️ Ce snapshot date du 28 octobre — ouvre Vibe et demande « mets à jour mon dashboard » : le site sera republié en quelques minutes.</div>'
          : "";

        var html = "";

        /* Hero DS */
        html += '<section class="card hero" aria-label="Prochain devoir surveillé">' +
          '<div class="kicker">⏳ Prochain devoir surveillé</div>' +
          '<p style="font-size:22px;font-weight:700;margin:12px 0 0;line-height:1.15">' + (heroTitle || hero.subject) + "</p>" +
          '<p class="sub" style="margin:4px 0 0;font-size:14px">' + hero.when + "</p>" +
          '<div class="tnum" style="display:flex;align-items:flex-end;gap:8px;margin:20px 0 0" aria-live="polite">' +
          (heroC.past
            ? '<span style="font-size:32px;font-weight:700">Terminé 🎉</span>'
            : '<span class="big tnum">J–' + heroC.d + '</span><span class="tnum" style="font-size:18px;font-weight:600;padding-bottom:4px;opacity:.9">' + heroC.h + "h" + pad(heroC.m) + "</span>") +
          "</div>" +
          '<div style="background:rgba(255,255,255,0.16);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:500;margin-top:16px">' +
          (nextDl && nextC
            ? "Puis DS " + nextDl.subject + " — " + nextDl.when + ' · <b class="tnum">' + (nextC.past ? "terminé" : "J–" + nextC.d) + "</b>"
            : "Tous les DS de ce snapshot sont passés 🎉") +
          "</div></section>";

        /* Anneaux */
        html += '<section class="card" aria-label="Progression du travail perso">' +
          '<div class="head"><div class="l"><span class="ico" style="background:rgba(255,59,48,0.1)">📊</span><div><h2>Travail perso — semaine du 26 oct.</h2><p class="sub">Anneaux : accompli · planifié · objectif</p></div></div></div>' +
          '<div style="display:flex;justify-content:center"><svg viewBox="0 0 200 200" width="170" height="170" role="img" aria-label="Accompli ' + RING.fait + " heures sur un objectif de " + RING.objectif + " heures, " + RING.planifie + ' heures planifiées">' +
          '<g transform="rotate(-90 100 100)">' +
          '<circle cx="100" cy="100" r="78" fill="none" stroke="var(--chip)" stroke-width="12"/>' + ringSvg("ringR", 78, 1, "var(--red)", animated) +
          '<circle cx="100" cy="100" r="62" fill="none" stroke="var(--chip)" stroke-width="12"/>' + ringSvg("ringB", 62, RING.planifie / RING.objectif, "var(--blue)", animated) +
          '<circle cx="100" cy="100" r="46" fill="none" stroke="var(--chip)" stroke-width="12"/>' + ringSvg("ringG", 46, RING.fait / RING.objectif, "var(--green)", animated) +
          "</g>" +
          '<text x="100" y="96" text-anchor="middle" font-size="30" font-weight="700" fill="var(--text)">' + RING.planifie + 'h</text>' +
          '<text x="100" y="116" text-anchor="middle" font-size="11" fill="var(--sub)">planifiées</text>' +
          "</svg></div>" +
          '<div class="legend">' +
          [["var(--green)", "Accompli (au 28 oct. soir)", RING.fait + "h"], ["var(--blue)", "Planifié cette semaine", RING.planifie + "h"], ["var(--red)", "Objectif max / semaine", RING.objectif + "h"]].map(function (r) {
            return '<div class="row"><span class="lbl"><span class="dot" style="background:' + r[0] + '"></span>' + r[1] + '</span><b class="tnum">' + r[2] + "</b></div>";
          }).join("") +
          "</div>" +
          '<p style="font-size:12px;color:var(--sub);margin-top:12px">Semaine des DS (2–8 nov.) : ' + fr(totalDs) + "h — allégée volontairement, la fraîcheur prime le volume.</p></section>";

        /* Prochaine journée */
        html += '<section class="card" aria-label="Prochaine journée">' +
          '<div class="head"><div class="l"><span class="ico" style="background:rgba(0,122,255,0.1)">🔔</span><div><h2>' +
          (upcoming ? (upcoming.isToday ? "Aujourd'hui — à venir" : upcoming.day.long) : "Planning terminé") + "</h2><p class='sub'>" +
          (upcoming ? upcoming.events.length + " créneau" + (upcoming.events.length > 1 ? "x" : "") + " à venir" + (ncd && !ncd.past ? " · prochain " + (ncd.d > 0 ? "J–" + ncd.d : "dans " + ncd.h + "h" + pad(ncd.m)) : "") : "—") +
          "</p></div></div></div>";
        if (upcoming) {
          html += upcoming.events.slice(0, 5).map(function (ev) { return evRow(ev, false, ev === nextFirst, upcoming.day.date, now); }).join("");
          if (upcoming.events.length > 5) html += '<p style="font-size:12px;font-weight:600;color:var(--sub);padding:4px 8px 0">+ ' + (upcoming.events.length - 5) + " autres créneaux — voir le planning ↓</p>";
        } else {
          html += '<p style="font-size:14px;color:var(--sub)">Aucun créneau à venir dans ce snapshot — demande une mise à jour.</p>';
        }
        html += "</section>";

        /* Planning */
        html += '<section class="card span2" aria-label="Planning">' +
          '<div class="head"><div class="l"><span class="ico" style="background:rgba(175,82,222,0.1)">🎯</span><div><h2>Planning — 29 oct. → 8 nov.</h2><p class="sub">' + day.long + '</p></div></div><span class="pill p">' + day.events.length + " créneaux</span></div>" +
          '<div class="chips" role="tablist" aria-label="Choisir un jour">' +
          DAYS.map(function (d) {
            var hasDs = d.events.some(function (e) { return e.kind === "ds"; });
            var hasSp = d.events.some(function (e) { return e.kind === "sport"; });
            return '<button type="button" role="tab" aria-selected="' + (d.date === day.date) + '" data-day="' + d.date + '" aria-label="' + d.long + '">' + d.short +
              '<span class="cdots">' + (hasDs ? '<span class="dot" style="width:6px;height:6px;background:' + (d.date === day.date ? "#fff" : "var(--red)") + '"></span>' : "") +
              (hasSp ? '<span class="dot" style="width:6px;height:6px;background:' + (d.date === day.date ? "#fff" : "var(--green)") + '"></span>' : "") + "</span></button>";
          }).join("") + "</div>" +
          '<div class="timeline">' + day.events.map(function (ev) {
            return evRow(ev, dayIsToday && evDate(day.date, ev.end) <= now, false, day.date, now);
          }).join("") + "</div>" +
          '<p class="note"><span class="lbl"><span class="dot" style="width:6px;height:6px;background:var(--red)"></span> DS</span><span class="lbl"><span class="dot" style="width:6px;height:6px;background:var(--green)"></span> Sport</span>Règles : rien après 21h30 · sport intouchable · max 2 matières en révision</p></section>';

        /* Échéances */
        html += '<section class="card" aria-label="Échéances">' +
          '<div class="head"><div class="l"><span class="ico" style="background:rgba(255,59,48,0.1)">🎯</span><div><h2>Échéances</h2><p class="sub">Base Notion « Échéances »</p></div></div></div>';
        DEADLINES.forEach(function (dl) {
          var c = countdown(now, new Date(dl.at));
          var pct = Math.round((dl.done / dl.total) * 100);
          html += '<div class="dl"><div class="topline"><span class="n">' + dl.icon + " " + dl.subject + '</span><span class="pill ' + (c.past ? "g" : "o") + '">' + (c.past ? "Terminé" : "J–" + c.d) + '</span></div>' +
            '<p class="when">' + dl.when + " · Préparation en cours</p>" +
            '<div class="prow"><div class="pbar"><div data-w="' + pct + '" style="width:' + (animated ? pct : 0) + '%"></div></div><span class="ct tnum">' + dl.done + "/" + dl.total + " révisions</span></div></div>";
        });
        html += '<div class="box rowline"><span style="font-size:13px;font-weight:600">🚀 ApprentyHunter</span><span class="pill p">Projet perso</span></div></section>';

        /* Sport */
        html += '<section class="card" aria-label="Sport">' +
          '<div class="head"><div class="l"><span class="ico" style="background:rgba(52,199,89,0.12)">❤️</span><div><h2>Sport</h2><p class="sub">Créneaux fixes — intouchables</p></div></div></div>' +
          '<div class="rowline" style="margin-bottom:10px"><b>🏐 Volleyball</b><span class="r">mardi &amp; vendredi · 18h–20h</span></div>' +
          '<div class="rowline" style="margin-bottom:10px"><b>🥋 Karaté</b><span class="r">mercredi · 18h30–20h</span></div>' +
          '<div class="box warn"><div class="rowline"><b>🏅 Match de volley</b><span class="pill o">sam. 7 nov.</span></div><p style="font-size:12px;color:var(--sub);margin-top:4px">11h · retour ~16h30 — séances du samedi déplacées au dimanche.</p></div></section>';

        /* Objectifs */
        html += '<section class="card" aria-label="Objectifs">' +
          '<div class="head"><div class="l"><span class="ico" style="background:rgba(0,122,255,0.1)">🚀</span><div><h2>Objectifs</h2><p class="sub">Cap sur 2027–2028</p></div></div></div>' +
          '<div class="bignum tnum">19+<small>/20</small></div>' +
          [["🚩", "Prépa MPSI → MP*"], ["🎯", "ISAE-SUPAERO · INSA Toulouse"], ["⏱️", "15–20 h de travail perso / semaine"]].map(function (g) {
            return '<div class="goal">' + g[0] + " " + g[1] + "</div>";
          }).join("") + "</section>";

        /* Notes */
        html += '<section class="card" aria-label="Suivi des notes">' +
          '<div class="head"><div class="l"><span class="ico" style="background:rgba(0,163,191,0.1)">📚</span><div><h2>Suivi des notes</h2><p class="sub">Base Notion « Notes »</p></div></div></div>' +
          '<div class="box" style="display:flex;gap:12px;align-items:center"><span style="font-size:28px">📝</span><p style="font-size:13px;color:var(--sub)"><b style="color:var(--text)">Aucune note pour l'instant.</b> Saisis tes notes dans Notion — elles apparaîtront ici à la prochaine mise à jour.</p></div>' +
          '<p style="font-size:12px;color:var(--sub);margin-top:12px">Objectif : rester au-dessus de 19 de moyenne générale.</p></section>';

        /* Charge */
        html += '<section class="card" aria-label="Charge de travail">' +
          '<div class="head"><div class="l"><span class="ico" style="background:rgba(0,122,255,0.1)">📊</span><div><h2>Charge de travail perso</h2><p class="sub">Heures planifiées · 29 oct. → 8 nov.</p></div></div></div>' +
          '<div class="chart">' + charge.map(function (c) {
            return '<div class="col"><div class="bar" style="height:' + Math.max(2, (c.heures / maxH) * 100) + '%" title="' + fr(c.heures) + ' h de travail perso"></div><span class="lbl">' + c.name + (c.ds ? " ⚠️" : "") + "</span></div>";
          }).join("") + "</div>" +
          '<p style="font-size:12px;color:var(--sub);margin-top:12px">Fin des vacances : ' + fr(totalVac) + "h de révisions · semaine des DS : " + fr(totalDs) + "h, puis remontée vers 15h+ dès le 9 nov.</p></section>";

        /* Agent */
        html += '<section class="card span2" aria-label="Agent Vibe">' +
          '<div class="head"><div class="l"><span class="ico" style="background:linear-gradient(135deg,#0a84ff,#af52de);color:#fff">✨</span><div><h2>Ton agent · Vibe</h2><p class="sub">2 automatisations actives</p></div></div><span style="display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--green)"><span class="dot"></span>En ligne</span></div>' +
          '<div class="agent"><div>' +
          '<div class="auto"><div class="t">🔔 Bilan &amp; planning hebdo</div><p class="d">chaque vendredi · 20h30 · prochain : ven. 6 nov.</p></div>' +
          '<div class="auto"><div class="t">⏰ To-dos du jour</div><p class="d">chaque matin · 7h00 · récap du jour dans la conversation</p></div>' +
          '<div class="skills">' + ["planificateur", "suivi-scolaire", "maths", "physique-chimie", "sciences-ingenieur"].map(function (s) { return "<span title=\"Skill — à activer dans Vibe\">" + s + "</span>"; }).join("") + "</div></div>" +
          '<div><p class="sect">Parle-moi simplement :</p><div class="cmds">' +
          ["« mets à jour mon dashboard »", "« bilan de la semaine »", "« planifie mes révisions de SI »", "« ajoute un DM de maths vendredi »"].map(function (c) { return "<span>" + c + "</span>"; }).join("") +
          '</div><p class="sect" style="margin-top:16px">🔗 Système</p><div class="sys">' +
          "<span><b>Notion</b> — base de suivi</span><span><b>Google Calendar</b> — horaires</span><span><b>Notion Calendar</b> — interface</span></div>" +
          '<p style="font-size:12px;color:var(--sub);margin-top:12px">Snapshot du ' + UPDATED + ". Ce site est mis à jour par ton agent : ouvre Vibe, demande « mets à jour mon dashboard », et le site est republié en quelques minutes.</p></div></div></section>';

        app.innerHTML = html;
        var newChip = document.querySelector(".chips");
        if (newChip) newChip.scrollLeft = chipScroll;

        /* Animation des anneaux et barres au premier rendu uniquement */
        if (!animated) {
          animated = true;
          setTimeout(function () {
            [["ringR", 78, 1], ["ringB", 62, RING.planifie / RING.objectif], ["ringG", 46, RING.fait / RING.objectif]].forEach(function (rg) {
              var el = document.getElementById(rg[0]);
              if (el) el.setAttribute("stroke-dashoffset", String(2 * Math.PI * rg[1] * (1 - rg[2])));
            });
            document.querySelectorAll(".pbar > div").forEach(function (b) { b.style.width = b.getAttribute("data-w") + "%"; });
          }, 80);
        }
      }

      /* Interaction journaux */
      document.getElementById("app").addEventListener("click", function (e) {
        var b = e.target.closest("button[data-day]");
        if (!b) return;
        selectedDay = b.getAttribute("data-day");
        render();
      });

      document.getElementById("updated").textContent = UPDATED;
      document.getElementById("updated2").textContent = UPDATED;
      renderSeg();
      applyTheme();
      render();
      setInterval(render, 30000);
    </script>
  </body>
</html>
