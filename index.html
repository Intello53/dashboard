          '<p style="font-size:22px;font-weight:700;margin:12px 0 0;line-height:1.15">' + hero.title + "</p>" +
          '<p class="sub" style="margin:4px 0 0;font-size:14px">' + hero.when + "</p>" +
          '<div class="tnum" style="display:flex;align-items:flex-end;gap:8px;margin:20px 0 0" aria-live="polite">' +
          (!heroC || heroC.past
            ? '<span style="font-size:32px;font-weight:700">Terminé 🎉</span>'
            : '<span class="big tnum">J–' + heroC.d + '</span><span class="tnum" style="font-size:18px;font-weight:600;padding-bottom:4px;opacity:.9">' + heroC.h + "h" + pad(heroC.m) + "</span>") +
          "</div>" +
          '<div style="background:rgba(255,255,255,0.16);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:500;margin-top:16px">' +
          (hero.next
            ? "Puis : " + hero.next.title + ' · <b class="tnum">' + (function () { var c2 = countdown(now, hero.next.at || hero.next.start); return c2.past ? "—" : "J–" + c2.d; })() + "</b>"
            : "Aucune autre échéance en vue 🎉") +
          "</div></section>";

        /* Carte focus */
        var fleft = focusLeft();
        html += '<section class="card" aria-label="Session focus">' +
          '<div class="head"><div class="l"><span class="ico" style="background:rgba(175,82,222,0.12)">🎯</span><div><h2>Session focus</h2><p class="sub">Lance un chrono — il compte dans tes anneaux</p></div></div></div>' +
          '<div style="display:flex;justify-content:center"><svg viewBox="0 0 200 200" width="150" height="150" role="img" aria-label="Minuteur de session focus">' +
          '<circle cx="100" cy="100" r="78" fill="none" stroke="var(--chip)" stroke-width="10"/>' +
          '<circle id="focusArc" cx="100" cy="100" r="78" fill="none" stroke="var(--purple)" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + (2 * Math.PI * 78) + '" stroke-dashoffset="' + (2 * Math.PI * 78) + '" style="transition: stroke-dashoffset 0.4s linear" transform="rotate(-90 100 100)"/>' +
          '<text id="focusTime" x="100" y="100" text-anchor="middle" dominant-baseline="middle" font-size="34" font-weight="700" fill="var(--text)" class="tnum">' + pad(Math.floor(fleft / 60)) + ":" + pad(fleft % 60) + "</text>" +
          '<text id="focusState" x="100" y="132" text-anchor="middle" font-size="11" fill="var(--sub)">' + (!focus.running ? "prêt" : (focus.paused ? "en pause" : "en cours")) + "</text>" +
          "</svg></div>" +
          '<div style="display:flex;gap:8px;justify-content:center;margin-top:14px">' +
          [25, 45, 60].map(function (m) { return '<button class="fbtn' + (m === focus.preset && !focus.running ? " on" : "") + '" data-m="' + m + '"' + (focus.running ? " disabled" : "") + ">" + m + " min</button>"; }).join("") +
          "</div>" +
          '<div style="display:flex;gap:8px;justify-content:center;margin-top:12px">' +
          '<button class="fbtn on" id="focusGo" style="min-width:132px">' + (!focus.running ? "▶ Démarrer" : (focus.paused ? "⏯ Reprendre" : "⏸ Pause")) + "</button>" +
          '<button class="fbtn" id="focusStop" title="Réinitialiser">✕</button></div>' +
          '<p class="note" style="justify-content:center">🔥 Série : <b id="streakN">' + streak + "</b> jour" + (streak > 1 ? "s" : "") + ' · Aujourd\'hui : <b class="tnum">' + todayMin + "</b> min validés</p>" +
          '<p style="font-size:12px;color:var(--sub);margin-top:8px;text-align:center">Coche aussi tes révisions dans le planning : tout se cumule dans l\'anneau accompli.</p></section>';

        html += '<section class="card" aria-label="Prochaine activité">' +
          '<div class="head"><div class="l"><span class="ico" style="background:rgba(0,122,255,0.1)">🔔</span><div><h2>À venir' + (nextFirst && ncd && !ncd.past ? " — dans " + (ncd.d > 0 ? "J–" + ncd.d : ncd.h + "h" + pad(ncd.m)) : "") + '</h2><p class="sub">' + (upcoming.length ? upcoming.length + " créneau" + (upcoming.length > 1 ? "x" : "") + " dans les " + DAYS_COUNT + " prochains jours" : "aucun créneau") + "</p></div></div></div>";
        if (upcoming.length) {
          html += upcoming.slice(0, 5).map(function (ev) { return evRow(ev, false, ev === nextFirst, now, dkey(ev.start) !== todayK); }).join("");
          if (upcoming.length > 5) html += '<p style="font-size:12px;font-weight:600;color:var(--sub);padding:4px 8px 0">+ ' + (upcoming.length - 5) + " autres — voir le planning ↓</p>";
        } else {
          html += '<p style="font-size:14px;color:var(--sub)">Rien à venir dans ton agenda pour les ' + DAYS_COUNT + " prochains jours.</p>";
        }
        html += "</section>";

        html += '<section class="card span2" aria-label="Planning">' +
          '<div class="head"><div class="l"><span class="ico" style="background:rgba(175,82,222,0.1)">🎯</span><div><h2>Planning — ' + DAYS_COUNT + ' jours</h2><p class="sub">' + frDate(day.d) + '</p></div></div><span class="pill p">' + day.events.length + " créneau" + (day.events.length > 1 ? "x" : "") + "</span></div>" +
          '<div class="chips" role="tablist" aria-label="Choisir un jour">' +
          days.map(function (x) {
            var k = dkey(x.d);
            var hasDs = x.events.some(function (e) { return e.kind === "ds"; });
            var hasSp = x.events.some(function (e) { return e.kind === "sport"; });
            return '<button type="button" role="tab" aria-selected="' + (k === dkey(day.d)) + '" data-day="' + k + '" aria-label="' + frDate(x.d) + '">' + SHORTDAYS[x.d.getDay()] + " " + x.d.getDate() +
              '<span class="cdots">' +
              (hasDs ? '<span class="dot" style="width:6px;height:6px;background:' + (k === dkey(day.d) ? "#fff" : "var(--red)") + '"></span>' : "") +
              (hasSp ? '<span class="dot" style="width:6px;height:6px;background:' + (k === dkey(day.d) ? "#fff" : "var(--green)") + '"></span>' : "") +
              "</span></button>";
          }).join("") + "</div>" +
          '<div class="timeline">' + (day.events.length
            ? day.events.map(function (ev) { return evRow(ev, dkey(day.d) === todayK && ev.end <= now, false, now, false); }).join("")
            : '<p style="font-size:14px;color:var(--sub);padding:8px">Aucun créneau ce jour-là dans ton agenda.</p>') + "</div>" +
          '<p class="note"><span class="lbl"><span class="dot" style="width:6px;height:6px;background:var(--red)"></span> DS</span><span class="lbl"><span class="dot" style="width:6px;height:6px;background:var(--green)"></span> Sport</span><span class="lbl"><span class="dot" style="width:6px;height:6px;background:var(--purple)"></span> Révision</span>Clique les ronds pour valider tes révisions</p></section>';

        html += '<section class="card" aria-label="Progression du travail perso">' +
          '<div class="head"><div class="l"><span class="ico" style="background:rgba(255,59,48,0.1)">📊</span><div><h2>Travail perso — cette semaine</h2><p class="sub">Accompli · planifié · objectif</p></div></div></div>' +
          '<div style="display:flex;justify-content:center"><svg viewBox="0 0 200 200" width="170" height="170" role="img" aria-label="Accompli ' + fr(accompli) + " heures sur un objectif de " + RING.objectif + " heures, " + fr(planifie) + ' heures planifiées">' +
          '<g transform="rotate(-90 100 100)">' +
          '<circle cx="100" cy="100" r="78" fill="none" stroke="var(--chip)" stroke-width="12"/>' + ringSvg("ringR", 78, "var(--red)") +
          '<circle cx="100" cy="100" r="62" fill="none" stroke="var(--chip)" stroke-width="12"/>' + ringSvg("ringB", 62, "var(--blue)") +
          '<circle cx="100" cy="100" r="46" fill="none" stroke="var(--chip)" stroke-width="12"/>' + ringSvg("ringG", 46, "var(--green)") +
          "</g>" +
          '<text x="100" y="96" text-anchor="middle" font-size="30" font-weight="700" fill="var(--text)">' + fr(planifie) + 'h</text>' +
          '<text x="100" y="116" text-anchor="middle" font-size="11" fill="var(--sub)">planifiées</text>' +
          "</svg></div>" +
          '<div class="legend">' +
          [["var(--green)", "Accompli (base + sessions validées)", fr(accompli) + "h"], ["var(--blue)", "Planifié cette semaine — en direct", fr(planifie) + "h"], ["var(--red)", "Objectif max / semaine", RING.objectif + "h"]].map(function (r) {
            return '<div class="row"><span class="lbl"><span class="dot" style="background:' + r[0] + '"></span>' + r[1] + '</span><b class="tnum">' + r[2] + "</b></div>";
          }).join("") +
          "</div>" +
          '<p style="font-size:12px;color:var(--sub);margin-top:12px">Chaque révision cochée et chaque session focus terminée s\'ajoute automatiquement. 🔥 Série en cours : ' + streak + " jour" + (streak > 1 ? "s" : "") + ".</p></section>";

        html += '<section class="card" aria-label="Échéances">' +
          '<div class="head"><div class="l"><span class="ico" style="background:rgba(255,59,48,0.1)">🎯</span><div><h2>Échéances</h2><p class="sub">Préparation des DS</p></div></div></div>';
        DEADLINES.forEach(function (dl) {
          var c = countdown(now, new Date(dl.at));
          var pct = Math.round((dl.done / dl.total) * 100);
          html += '<div class="dl"><div class="topline"><span class="n">' + dl.icon + " " + dl.subject + '</span><span class="pill ' + (c.past ? "g" : "o") + '">' + (c.past ? "Terminé" : "J–" + c.d) + '</span></div>' +
            '<p class="when">' + dl.when + " · Préparation en cours</p>" +
            '<div class="prow"><div class="pbar"><div data-w="' + pct + '" style="width:' + (animated ? pct : 0) + '%"></div></div><span class="ct tnum">' + dl.done + "/" + dl.total + " révisions</span></div></div>";
        });
        html += '<div class="box rowline"><span style="font-size:13px;font-weight:600">🚀 ApprentyHunter</span><span class="pill p">Projet perso</span></div></section>';

        var sports = upcoming.filter(function (e) { return e.kind === "sport"; });
        html += '<section class="card" aria-label="Sport">' +
          '<div class="head"><div class="l"><span class="ico" style="background:rgba(52,199,89,0.12)">❤️</span><div><h2>Sport</h2><p class="sub">Créneaux fixes — intouchables</p></div></div></div>' +
          STATIC_SPORT.map(function (s) { return '<div class="rowline" style="margin-bottom:10px"><b>' + s.t + '</b><span class="r">' + s.r + "</span></div>"; }).join("") +
          (sports.length ? '<p class="sect" style="margin-top:12px">Prochains créneaux (en direct depuis ton agenda) :</p>' + sports.slice(0, 4).map(function (e) { return '<div class="sportline"><span>' + e.title + '</span><span class="tnum" style="color:var(--sub)">' + frDateTime(e.start) + " – " + fmtH(e.end) + "</span></div>"; }).join("") : '<div class="box" style="margin-top:10px"><p style="font-size:13px;color:var(--sub)">Aucun créneau sportif à venir dans l\'agenda.</p></div>') + "</section>";

        html += '<section class="card" aria-label="Objectifs">' +
          '<div class="head"><div class="l"><span class="ico" style="background:rgba(0,122,255,0.1)">🚀</span><div><h2>Objectifs</h2><p class="sub">Cap sur 2027–2028</p></div></div></div>' +
          '<div class="bignum tnum">19+<small>/20</small></div>' +
          OBJECTIFS.map(function (g) { return '<div class="goal">' + g + "</div>"; }).join("") + "</section>";

        html += '<section class="card" aria-label="Suivi des notes">' +
          '<div class="head"><div class="l"><span class="ico" style="background:rgba(0,163,191,0.1)">📚</span><div><h2>Suivi des notes</h2><p class="sub">Base Notion « Notes »</p></div></div></div>' +
          (NOTES.length
            ? NOTES.map(function (n) { return '<div class="sportline"><span>' + n.subject + '</span><span class="tnum" style="color:var(--sub)">' + n.value + " · " + n.date + "</span></div>"; }).join("")
            : '<div class="box" style="display:flex;gap:12px;align-items:center"><span style="font-size:28px">📝</span><p style="font-size:13px;color:var(--sub)"><b style="color:var(--text)">Aucune note pour l\'instant.</b> Saisis tes notes dans Notion — elles apparaîtront ici à la prochaine mise à jour du fichier.</p></div>') +
          '<p style="font-size:12px;color:var(--sub);margin-top:12px">Objectif : rester au-dessus de 19 de moyenne générale.</p></section>';

        html += '<section class="card" aria-label="Charge de travail">' +
          '<div class="head"><div class="l"><span class="ico" style="background:rgba(0,122,255,0.1)">📊</span><div><h2>Charge de travail perso</h2><p class="sub">Heures planifiées · clique une barre pour voir le jour</p></div></div></div>' +
          '<div class="chart">' + charge.map(function (c) {
            return '<div class="col" data-day="' + c.k + '" title="' + fr(c.heures) + ' h de travail perso"><div class="bar" style="height:' + Math.max(2, (c.heures / maxH) * 100) + '%"></div><span class="lbl">' + c.name + (c.ds ? " ⚠️" : "") + "</span></div>";
          }).join("") + "</div></section>";

        html += '<section class="card span2" aria-label="Agent Vibe">' +
          '<div class="head"><div class="l"><span class="ico" style="background:linear-gradient(135deg,#0a84ff,#af52de);color:#fff">✨</span><div><h2>Ton agent · Vibe</h2><p class="sub">2 automatisations actives</p></div></div><span style="display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:' + (state.source === "live" ? "var(--green)" : "var(--orange)") + '"><span class="dot"></span>' + (state.source === "live" ? "Temps réel" : "Sync en attente") + "</span></div>" +
          '<div class="agent"><div>' +
          '<div class="auto"><div class="t">🔔 Bilan &amp; planning hebdo</div><p class="d">chaque vendredi · 20h30</p></div>' +
          '<div class="auto"><div class="t">⏰ To-dos du jour</div><p class="d">chaque matin · 7h00</p></div>' +
          '<div class="skills">' + ["planificateur", "suivi-scolaire", "maths", "physique-chimie", "sciences-ingenieur"].map(function (s) { return "<span>" + s + "</span>"; }).join("") + "</div></div>" +
          '<div><p class="sect">Le site vit tout seul :</p>' +
          '<div class="cmds">' + ["Planning : en direct depuis Google Calendar", "Compteurs DS : recalculés toutes les 30 s", "Synchro calendrier : toutes les 5 min", "Tes révisions cochées restent mémorisées"].map(function (c) { return "<span>" + c + "</span>"; }).join("") + "</div>" +
          '<p class="sect" style="margin-top:16px">🔗 Système</p><div class="sys">' +
          "<span><b>Notion</b> — base de suivi</span><span><b>Google Calendar</b> — horaires</span><span><b>Notion Calendar</b> — interface</span></div>" +
          '<p style="font-size:12px;color:var(--sub);margin-top:12px">Chaque créneau ajouté, déplacé ou supprimé dans ton agenda apparaît ici en quelques minutes — sans rien faire.</p></div></div></section>';

        app.innerHTML = html;
        var newChip = document.querySelector(".chips");
        if (newChip) {
          if (scrollChip) {
            var onBtn = newChip.querySelector("button.on");
            if (onBtn) newChip.scrollLeft = onBtn.offsetLeft - newChip.clientWidth / 2 + onBtn.clientWidth / 2;
            scrollChip = false;
          } else newChip.scrollLeft = chipScroll;
        }

        if (!animated) {
          animated = true;
          setTimeout(function () {
            [["ringR", 78, 1], ["ringB", 62, planifie / RING.objectif], ["ringG", 46, accompli / RING.objectif]].forEach(function (rg) {
              var el = document.getElementById(rg[0]);
              if (el) el.setAttribute("stroke-dashoffset", String(2 * Math.PI * rg[1] * (1 - Math.min(1, rg[2]))));
            });
            document.querySelectorAll(".pbar > div").forEach(function (b) { b.style.width = b.getAttribute("data-w") + "%"; });
            renderFocus();
          }, 80);
        }
      }

      /* ---------- Thème ---------- */
      var themeMode = "auto";
      try { themeMode = sget("dogukan-dash-theme") || "auto"; } catch (e) {}
      function applyTheme() {
        var dark = themeMode === "dark" || (themeMode === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#000000" : "#F2F2F7");
      }
      function renderSeg() {
        var seg = document.getElementById("themeseg");
        var opts = [["auto", "↻", "Auto"], ["light", "☀️", "Clair"], ["dark", "🌙", "Sombre"]];
        seg.innerHTML = opts.map(function (o) {
          return '<button type="button" role="radio" aria-checked="' + (themeMode === o[0]) + '" data-mode="' + o[0] + '" aria-label="Thème ' + o[2].toLowerCase() + '">' + o[1] + " " + o[2] + "</button>";
        }).join("");
      }
      document.getElementById("themeseg").addEventListener("click", function (e) {
        var b = e.target.closest("button[data-mode]");
        if (!b) return;
        themeMode = b.getAttribute("data-mode");
        try { sset("dogukan-dash-theme", themeMode); } catch (err) {}
        renderSeg(); applyTheme();
      });
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { if (themeMode === "auto") applyTheme(); });

      /* ---------- Interactions ---------- */
      document.getElementById("app").addEventListener("click", function (e) {
        var chk = e.target.closest("button.chk");
        if (chk) {
          var ev = EVREG[+chk.getAttribute("data-i")];
          if (!ev) return;
          var key = evKey(ev), c = loadChecks();
          if (c[key]) { delete c[key]; saveChecks(c); toast("Session décochée"); }
          else {
            var min = Math.max(1, Math.round((ev.end - ev.start) / 60000));
            c[key] = { d: dkey(ev.start), min: min, ts: Date.now() };
            saveChecks(c); confetti(); toast("✔ " + min + " min validées — continue !");
          }
          render(); return;
        }
        var fb = e.target.closest("button.fbtn[data-m]");
        if (fb) { focusSet(+fb.getAttribute("data-m")); return; }
        if (e.target.closest("#focusGo")) { focusToggle(); return; }
        if (e.target.closest("#focusStop")) { focusReset(); return; }
        var dayBtn = e.target.closest("[data-day]");
        if (dayBtn) { selectedDay = dayBtn.getAttribute("data-day"); scrollChip = true; render(); return; }
      });
      document.getElementById("refreshbtn").addEventListener("click", function () { sync(); });

      /* ---------- Démarrage & minuteurs ---------- */
      renderSeg();
      applyTheme();
      render();
      sync();
      setInterval(render, 30000);
      setInterval(function () { sync(); }, SYNC_EVERY_MS);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && Date.now() - (state.lastSync ? state.lastSync.getTime() : 0) > SYNC_EVERY_MS) sync();
      });
    </script>
  </body>
</html>
